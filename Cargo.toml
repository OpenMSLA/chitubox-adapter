[package]
name = "openmsla_chitubox_adapter"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.43.0", features = ["full"] }
anyhow = "1.0.95"
serde_json = "1.0.138"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
] }
sha1 = "0.11"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
serde = { version = "1.0.217", features = ["derive"] }
regex = "1.13.1"
